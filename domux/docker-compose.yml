services:
  postgres:
    image: postgres:16-alpine
    container_name: domux-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: domux
      POSTGRES_PASSWORD: domux
      POSTGRES_DB: domux
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domux"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: domux-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://domux:domux@postgres:5432/domux
      JWT_ACCESS_SECRET: change_me_access
      JWT_REFRESH_SECRET: change_me_refresh
      WEB_URL: http://localhost:3000
    ports:
      - "4000:4000"

volumes:
  postgres_data:
